name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency Audit
        run: npm audit --audit-level=high
        # Fails the build if any HIGH or CRITICAL vulnerabilities found

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Check for hardcoded secrets
        run: |
          if grep -r "NEXT_PUBLIC_SUPABASE_KEY" src/ --include="*.ts" --include="*.tsx"; then
            echo "ERROR: Never hardcode API keys in source code"
            exit 1
          fi
