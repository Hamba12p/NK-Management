name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency Audit
        run: npm audit --audit-level=high
        # Fails the build if any HIGH or CRITICAL vulnerabilities found

      - name: Unit Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type Check
        run: npx tsc --noEmit

      - name: Check for hardcoded Supabase credentials
        run: |
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{20,}|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' -- src; then
            echo "ERROR: Supabase credentials must not be hardcoded in source code"
            exit 1
          fi
